name: Update publications

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from PubMed and rewrite the list
        run: python scripts/update_publications.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain publications.html pubs.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications.html pubs.json
            git commit -m "Update publications from PubMed"
            git push
            echo "Publication list updated."
          else
            echo "No change; nothing to commit."
          fi
